<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
    window.alert(`Bem-vindo ao site das operações basicas de matematica`)
    //Dissipara um janela de CONFIRMAÇÃO
    window.confirm(`Continuar`)

    const n1= window.prompt('Digite um numero')
    const n2= window.prompt('Digite outro numero')
    const soma = n1 + n2;
    const sub = n1 - n2;
    const mut = n1 * n2;
    const div = n1 / n2;

    document.write(`A soma dos numeros é, ${soma} <br>` );
    document.write(`A subtração dos numeros é, ${sub} <br>` );
    document.write(`A multiplicação dos numeros é, ${mut} <br>` );
    document.write(`A divisão dos numeros é, ${div} <br>` );

    
    </script>
</body>
</html>
